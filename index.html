<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Coins - Prototype</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <section class="card">

        <!-- PROTOTYPE LABEL -->
        <div class="prototype-label">
            PROTOTYPE
        </div>

        <h1>Get Coins</h1>

        <p class="subtitle">
            Save about 25% on service fees from third-party providers.
        </p>


        <!-- =========================
             USERNAME
        ========================== -->

        <div class="username-box">

            <img
                class="tiktok-logo"
                src="assets/tiktok.png"
                alt="TikTok"
            >

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="off"
                maxlength="30"
            >

            <span
                id="username-status"
                class="username-status">
            </span>

        </div>


        <!-- =========================
             COIN PACKAGES
        ========================== -->

        <div
            class="coin-grid"
            id="coin-grid"
        >

            <button
                type="button"
                class="coin-card"
                data-coins="30"
                data-price="0.38"
            >

                <img
                    src="assets/tiktok-coin.png"
                    alt=""
                    class="coin-logo"
                >

                <strong>30</strong>

                <span>$0.38</span>

            </button>


            <button
                type="button"
                class="coin-card"
                data-coins="350"
                data-price="4.36"
            >

                <img
                    src="assets/coin.png"
                    alt=""
                    class="coin-logo"
                >

                <strong>350</strong>

                <span>$4.36</span>

            </button>


            <button
                type="button"
                class="coin-card"
                data-coins="700"
                data-price="8.73"
            >

                <img
                    src="assets/coin.png"
                    alt=""
                    class="coin-logo"
                >

                <strong>700</strong>

                <span>$8.73</span>

            </button>


            <button
                type="button"
                class="coin-card"
                data-coins="1400"
                data-price="17.45"
            >

                <img
                    src="assets/coin.png"
                    alt=""
                    class="coin-logo"
                >

                <strong>1,400</strong>

                <span>$17.45</span>

            </button>


            <button
                type="button"
                class="coin-card"
                data-coins="3500"
                data-price="43.63"
            >

                <img
                    src="assets/coin.png"
                    alt=""
                    class="coin-logo"
                >

                <strong>3,500</strong>

                <span>$43.63</span>

            </button>


            <button
                type="button"
                class="coin-card"
                data-coins="7000"
                data-price="87.27"
            >

                <img
                    src="assets/coin.png"
                    alt=""
                    class="coin-logo"
                >

                <strong>7,000</strong>

                <span>$87.27</span>

            </button>


            <button
                type="button"
                class="coin-card"
                data-coins="17500"
                data-price="218.17"
            >

                <img
                    src="assets/coin.png"
                    alt=""
                    class="coin-logo"
                >

                <strong>17,500</strong>

                <span>$218.17</span>

            </button>


            <!-- CUSTOM -->

            <button
                type="button"
                class="coin-card custom-card"
                id="custom-card"
            >

                <img
                    src="assets/coin.png"
                    alt=""
                    class="coin-logo"
                >

                <strong>Custom</strong>

                <span>
                    Support large quantities
                </span>

            </button>

        </div>


        <!-- =========================
             CUSTOM COIN
        ========================== -->

        <div
            id="custom-section"
            class="custom-section hidden"
        >

            <label for="custom-coins">
                Enter coin quantity
            </label>

            <input
                type="number"
                id="custom-coins"
                min="1"
                step="1"
                placeholder="Enter amount"
            >

            <div
                class="custom-price"
                id="custom-price"
            >
                $0.00
            </div>

        </div>


        <!-- =========================
             PAYMENT
        ========================== -->

        <h2>
            Select Payment Method
        </h2>


        <div class="payment-grid">


            <!-- VISA -->

            <button
                type="button"
                class="payment-card"
                data-payment="Visa"
            >

                <img
                    src="assets/visa.png"
                    alt="Visa"
                >

            </button>


            <!-- MASTERCARD -->

            <button
                type="button"
                class="payment-card"
                data-payment="MasterCard"
            >

                <img
                    src="assets/mastercard.png"
                    alt="MasterCard"
                >

            </button>


            <!-- PAYPAL -->

            <button
                type="button"
                class="payment-card"
                data-payment="PayPal"
            >

                <img
                    src="assets/paypal.png"
                    alt="PayPal"
                >

            </button>


            <!-- JCB -->

            <button
                type="button"
                class="payment-card"
                data-payment="JCB"
            >

                <img
                    src="assets/jcb.png"
                    alt="JCB"
                >

            </button>

        </div>


        <!-- =========================
             BOTTOM
        ========================== -->

        <div class="bottom-area">

            <div class="total">

                Total:

                <span id="total-coins">
                    0
                </span>

                coins

            </div>


            <button
                type="button"
                id="confirm-button"
                class="confirm-button"
            >
                Confirm
            </button>

        </div>

    </section>

</main>


<!-- =========================
     LOADING
========================== -->

<div
    id="loading-overlay"
    class="loading-overlay hidden"
>

    <div class="loader"></div>

</div>


<!-- =========================
     SUCCESS
========================== -->

<div
    id="success-overlay"
    class="modal-overlay hidden"
>

    <div class="success-modal">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Prototype Request
        </h2>

        <p>

            Selected:

            <strong id="modal-coins">
                0
            </strong>

            coins.

        </p>

        <p>

            Amount:

            <strong id="modal-price">
                $0.00
            </strong>

        </p>

        <p>

            Payment method:

            <strong id="modal-payment">
                -
            </strong>

        </p>

        <button
            type="button"
            id="close-modal"
            class="ok-button"
        >
            OK
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
